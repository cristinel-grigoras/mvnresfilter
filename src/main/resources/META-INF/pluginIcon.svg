<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
    <defs>
        <linearGradient id="quillGradient" x1="0.5" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8B0000"/>
            <stop offset="50%" stop-color="#C71A36"/>
            <stop offset="100%" stop-color="#E74C3C"/>
        </linearGradient>
    </defs>
    <!-- Maven-style feather plume (left side) -->
    <!-- Feather spine/quill -->
    <path d="M8 36 Q11 27 15 15" fill="none" stroke="url(#quillGradient)" stroke-width="2" stroke-linecap="round"/>
    <!-- Left barbs -->
    <path d="M8 36 Q4 28 6 22 Q10 24 12 28" fill="#C71A36" opacity="0.7"/>
    <path d="M10 30 Q5 22 8 16 Q12 18 13 23" fill="#C71A36" opacity="0.55"/>
    <path d="M12 24 Q8 16 11 10 Q14 13 14 18" fill="#C71A36" opacity="0.4"/>
    <!-- Right barbs -->
    <path d="M10 32 Q14 26 18 22 Q16 28 12 32" fill="#E74C3C" opacity="0.6"/>
    <path d="M12 26 Q16 20 20 16 Q18 22 14 26" fill="#E74C3C" opacity="0.45"/>
    <path d="M14 20 Q17 14 20 9 Q19 15 16 20" fill="#E74C3C" opacity="0.35"/>

    <!-- Funnel/filter (right side) -->
    <path d="M21 8 L39 8 L33 20 L27 20 Z" fill="#3498DB" stroke="#2980B9" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Funnel spout -->
    <rect x="27" y="20" width="6" height="8" rx="0.5" fill="#3498DB" stroke="#2980B9" stroke-width="0.8"/>
    <!-- Filter lines inside funnel -->
    <line x1="24" y1="12" x2="36" y2="12" stroke="#2980B9" stroke-width="0.5" opacity="0.5"/>
    <line x1="25" y1="16" x2="35" y2="16" stroke="#2980B9" stroke-width="0.5" opacity="0.5"/>
    <!-- Drops coming out of funnel -->
    <circle cx="30" cy="31" r="1" fill="#3498DB" opacity="0.8"/>
    <circle cx="30" cy="35" r="0.8" fill="#3498DB" opacity="0.5"/>
</svg>
