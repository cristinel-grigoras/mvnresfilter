<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
    <!-- Maven-style feather plume (left side) — lighter for dark theme -->
    <!-- Feather spine/quill -->
    <path d="M8 36 Q12 20 18 4" fill="none" stroke="#E74C3C" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left barbs -->
    <path d="M8 36 Q4 28 6 22 Q10 24 12 28" fill="#E74C3C" opacity="0.7"/>
    <path d="M10 30 Q5 22 8 16 Q12 18 13 23" fill="#E74C3C" opacity="0.55"/>
    <path d="M12 24 Q8 16 11 10 Q14 13 14 18" fill="#E74C3C" opacity="0.4"/>
    <!-- Right barbs -->
    <path d="M10 32 Q14 26 18 22 Q16 28 12 32" fill="#FF6B6B" opacity="0.6"/>
    <path d="M12 26 Q16 20 20 16 Q18 22 14 26" fill="#FF6B6B" opacity="0.45"/>
    <path d="M14 20 Q17 14 20 9 Q19 15 16 20" fill="#FF6B6B" opacity="0.35"/>

    <!-- Funnel/filter (right side) — brighter for dark theme -->
    <path d="M24 10 L36 10 L32 20 L28 20 Z" fill="#5DADE2" stroke="#85C1E9" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Funnel spout -->
    <rect x="28" y="20" width="4" height="8" rx="0.5" fill="#5DADE2" stroke="#85C1E9" stroke-width="0.8"/>
    <!-- Filter lines inside funnel -->
    <line x1="26" y1="13" x2="34" y2="13" stroke="#85C1E9" stroke-width="0.5" opacity="0.5"/>
    <line x1="27" y1="16" x2="33" y2="16" stroke="#85C1E9" stroke-width="0.5" opacity="0.5"/>
    <!-- Drops coming out of funnel -->
    <circle cx="30" cy="31" r="1" fill="#5DADE2" opacity="0.8"/>
    <circle cx="30" cy="35" r="0.8" fill="#5DADE2" opacity="0.5"/>
</svg>
