# Tests property loading order:
# app.name: project default "DefaultApp" → common.properties "FilterTestApp"
app.name=${app.name}
# app.context: project default "/default" → filter file overrides per profile
app.context=${app.context}
# log.level: project default "INFO" → filter file → profile <properties> (highest)
log.level=${log.level}
# From common.properties only
cache.provider=${cache.provider}
log.format=${log.format}
# From profile filter file only
db.url=${db.url}
db.username=${db.username}
auth.url=${auth.url}
# From common.properties, overridden by profile filter
db.pool.min=${db.pool.min}
db.pool.max=${db.pool.max}
# Built-in
project.artifactId=${project.artifactId}
project.version=${project.version}
